# Keyless OpenAI Responses composition for the pi-ai metadata retry snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                deepseek-official:
                  api: openai-responses
                  baseURL: !!js process.env.DSH_SNAPSHOT_PI_AI_URL
                  apiKeyEnv: DSH_SNAPSHOT_PI_AI_KEY
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
                      maxTokens: 128
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    retryableCodes: [SERVER, TRANSPORT]
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
