# Experimental Agent Teams profile layer. Apply after dsh-base so these replacements
# remove the global continuable-child controls before a Team-aware preset mounts
# the overlapping list_agents, send_message, and interrupt_agent names. The Team
# service remains host-owned; model-facing Team tools belong to the explicit Team
# presets that opt into this capability.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
